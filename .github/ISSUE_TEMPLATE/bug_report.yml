name: Bug Report
description: Something doesn't seem correct and it might be a bug
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: |
        A clear and concise description of what the bug is.
        Is it a game crash, an unexpected behavior, or has something gone wrong?
        If applicable, add screenshots to help explain the bug.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: to-reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the bug
      placeholder: |
        1. Join the server
        2. Run /unplug 5
        3. Reconnect
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: My bot is standing where I left, and I take its place on reconnect
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened?
      placeholder: The bot never appeared
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |-
If it's a crash, send the corresponding server log from the `logs` folder here.
        Please upload the log file as an attachment, or upload the log to [pastebin](https://pastebin.com/) / [mclo.gs](https://mclo.gs/) and paste the url here.
        Please refrain from pasting the entire log file directly.
        Leave empty if there is none.
      placeholder: https://pastebin.com/J6b7lKxR 
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      description: The Paper version and build this occurs on (see /version).
      placeholder: 26.2 build 112
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Unplugged AFK version
      description: The plugin version this occurs on.
      placeholder: 0.3.0
    validations:
      required: true
  - type: textarea
    id: other-information
    attributes:
      label: Other information
      description: |
        Anything else useful: other plugins installed (especially anticheats,
        EssentialsX or CMI), and your config. Logs are far more useful with
        "debugMode": true set in the config.
      placeholder: The issue only occurs if the player is in survival mode
  - type: checkboxes
    id: check-list
    attributes:
      label: Check list
      options:
        - label: I have verified that the issue persists in the latest version of the plugin.
          required: true
        - label: I have searched the existing issues and confirmed that this is not a duplicate.
          required: true
