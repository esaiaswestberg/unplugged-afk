# Gradle
	org.gradle.jvmargs=-Xmx4G
	org.gradle.parallel=true
	org.gradle.caching=true

# Plugin Properties
	# Bukkit plugin names allow no spaces or colons, so the slug is the plugin
	# name and plugin_display_name is used for log output and documentation.
	plugin_slug=unplugged-afk-paper-edition
	plugin_display_name=Unplugged AFK: Paper Edition
	# Permission namespace and API package identifier. Deliberately unchanged
	# from the Fabric mod so existing permission setups keep working.
	plugin_id=unplugged_afk
	plugin_author=esaiaswestberg
	plugin_original_author=sakura-ryoko
	plugin_version=0.4.0
	maven_group=io.github.esaiaswestberg
	archives_base_name=unplugged-afk-paper-edition

# Paper
	# https://fill.papermc.io/v3/projects/paper/versions
	minecraft_version=26.3
	# https://repo.papermc.io/repository/maven-public/io/papermc/paper/dev-bundle/
	# 26.3 has no stable build yet, so this tracks the newest alpha until Paper
	# promotes a recommended build.
	paper_dev_bundle=26.3.build.49-alpha
	# https://plugins.gradle.org/plugin/io.papermc.paperweight.userdev
	# beta.24 needs a Gradle 9.7 plugin API and a JDK 21+ build JVM.
	paperweight_version=2.0.0-beta.24
	# https://plugins.gradle.org/plugin/xyz.jpenilla.run-paper
	runpaper_version=3.1.0
	java_version=25
